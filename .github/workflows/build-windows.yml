name: Build Lumenforge Windows installer






on:


  workflow_dispatch:
  




permissions:


  contents: read
  




jobs:


  build-windows:
  
    name: Build Lumenforge x64 setup executable
    
    runs-on: windows-latest
    
    timeout-minutes: 45
    
    steps:
    
      - name: Check out bootstrap repository
      
        uses: actions/checkout@v4
        




      - name: Download packaged Lumenforge source
      
        shell: pwsh
        
        run: Invoke-WebRequest -Uri "https://files.manuscdn.com/user_upload_by_module/session_file/310519663641558116/zIFBvVSEBcfTHwpE.zip" -OutFile "$env:GITHUB_WORKSPACE\source.zip"
        




      - name: Expand packaged source
      
        shell: pwsh
        
        run: Expand-Archive -Path "$env:GITHUB_WORKSPACE\source.zip" -DestinationPath "$env:GITHUB_WORKSPACE\source" -Force
        




      - name: Set up Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: 22
          




      - name: Set up pnpm
      
        uses: pnpm/action-setup@v4
        
        with:
        
          version: 10.4.1
          
