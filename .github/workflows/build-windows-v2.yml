name: Build Lumenforge Windows installer v2



on:

  workflow_dispatch:
  


permissions:

  contents: read
  


jobs:

  build-windows:
  
    name: Build Lumenforge x64 setup executable
    
    runs-on: windows-latest
    
    timeout-minutes: 45
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Download complete Lumenforge source
      
        shell: pwsh
        
        run: Invoke-WebRequest -Uri "https://files.manuscdn.com/user_upload_by_module/session_file/310519663641558116/zIFBvVSEBcfTHwpE.zip" -OutFile "$env:GITHUB_WORKSPACE\source.zip"
        
      - name: Expand source
      
        shell: pwsh
        
        run: Expand-Archive -Path "$env:GITHUB_WORKSPACE\source.zip" -DestinationPath "$env:GITHUB_WORKSPACE\source" -Force
        
      - uses: actions/setup-node@v4
      
        with:
        
          node-version: 22
          
      - uses: pnpm/action-setup@v4
      
        with:
        
          version: 10.4.1
          
      - uses: dtolnay/rust-toolchain@stable
      
        with:
        
          toolchain: stable
          
      - name: Install and validate project
      
        working-directory: source
        
        run: |
        
          pnpm install --frozen-lockfile
          
          pnpm check
          
      - name: Build NSIS installer
      
        working-directory: source
        
        run: pnpm desktop:build --bundles nsis
        
      - uses: actions/upload-artifact@v4
      
        with:
        
          name: Lumenforge-Windows-x64-NSIS
          
          path: source/src-tauri/target/release/bundle/nsis/*.exe
          
          if-no-files-found: error
          
          retention-days: 30
          





































